name: Deploy API to Hugging Face
# Copies the backend into the Hugging Face Space on every push to main.
# Needs a GitHub secret HF_TOKEN (Hugging Face access token with write permission).
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

env:
  HF_USER: Janvi07
  HF_SPACE: coastgrid-twin-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Space folder
        run: |
          mkdir space
          cp -r backend/app backend/data backend/requirements.txt backend/Dockerfile space/
          cat > space/README.md <<'MD'
          ---
          title: CoastGrid Twin API
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          Backend API for CoastGrid Twin (Team TwinVolt). Source: https://github.com/JanviSharma07/coastgrid-twin
          MD
          sed -i 's/^          //' space/README.md
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN secret not set yet - skipping deploy"; exit 0; fi
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}" main
